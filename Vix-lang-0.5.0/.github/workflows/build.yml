name: Build & Release

on:
  push:
    branches: [main, master, stage2]
    tags: ["v*"]
  pull_request:
    branches: [main, master, stage2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            arch: x86_64
            pkgos: linux
            ext: tar.gz
          - os: macos-14
            name: macos-arm64
            arch: arm64
            pkgos: macos
            ext: tar.gz
          - os: windows-2022
            name: windows-amd64
            arch: x86_64
            pkgos: windows
            ext: zip

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      # ===================== Linux =====================
      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev lld-18 liblld-18-dev clang-18 flex bison patchelf libstdc++-12-dev python3-pip
          sudo pip3 install pytest
          echo "LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/12" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/12" >> $GITHUB_ENV

      # ===================== macOS =====================
      - name: Install LLVM and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@18 flex bison
          LLVM_PREFIX="$(brew --prefix llvm@18)"
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          # LLD is bundled with llvm@18; LLDConfig.cmake is under LLVM's lib/cmake/lld
          echo "CMAKE_PREFIX_PATH=${LLVM_PREFIX}" >> $GITHUB_ENV
          echo "LLD_DIR=${LLVM_PREFIX}/lib/cmake/lld" >> $GITHUB_ENV
          pip3 install --break-system-packages pytest

      # ===================== Windows (MSVC + vcpkg) =====================
      - name: Setup MSVC developer command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "22.1.6"
          $archive = "$env:TEMP\clang+llvm-$version.tar.xz"
          $tarFile  = "$env:TEMP\clang+llvm-$version.tar"
          $extractDir = "C:\Program Files\LLVM"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
          
          Write-Output "Downloading LLVM $version (portable tarball) ..."
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          
          # 清除旧版
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\LLVM" -ErrorAction SilentlyContinue
          
          # 两步解压：tar.xz → tar → 文件目录
          Write-Output "Step 1/2: decompress .tar.xz → .tar ..."
          & "C:\Program Files\7-Zip\7z.exe" x $archive -o"$env:TEMP" -y -bso1 2>&1 | Write-Output
          
          Write-Output "Step 2/2: extract .tar → files ..."
          & "C:\Program Files\7-Zip\7z.exe" x $tarFile -o"$extractDir" -y -bso1 2>&1 | Write-Output
          
          # tarball 包含一个顶层目录 clang+llvm-22.1.6-x86_64-pc-windows-msvc/
          $baseDir = Get-ChildItem $extractDir -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $baseDir) { throw "LLVM extraction produced no top-level directory" }
          
          $configDir = Join-Path $baseDir.FullName "lib\cmake\llvm"
          $binDir    = Join-Path $baseDir.FullName "bin"
          
          if (-not (Test-Path $configDir\LLVMConfig.cmake)) {
            Write-Output "--- Diagnostics: contents of extracted LLVM ---"
            Get-ChildItem $baseDir.FullName -Depth 1 | ForEach-Object { Write-Output "  $($_.FullName)" }
            Get-ChildItem -Recurse -Filter "*.cmake" -Path $baseDir.FullName -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "  $($_.FullName)" }
            throw "LLVMConfig.cmake not found at expected path: $configDir"
          }
          
          Write-Output "LLVM installed at $($baseDir.FullName)"
          echo "LLVM_DIR=$configDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compute vcpkg cache key (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        shell: pwsh
        run: |
          # 只对包列表 + triplet 做 hash，无关改动不影响缓存
          $pkgList = "libxml2:x64-windows-static zlib:x64-windows-static"
          $hash = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash(
              [System.Text.Encoding]::UTF8.GetBytes($pkgList)
            )
          ).Replace("-", "").Substring(0, 16).ToLower()
          echo "key=vcpkg-win-x64-ws-${hash}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
          key: ${{ steps.vcpkg-cache.outputs.key }}
          restore-keys: vcpkg-win-x64-ws-

      - name: Install vcpkg deps and tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # 覆盖 GitHub runner 预设的 VS 内置 vcpkg 路径
          VCPKG_ROOT: C:\vcpkg
        run: |
          # 设 VCPKG_ROOT 供后续步骤使用
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Install flex, bison via Chocolatey (provides win_flex.exe, win_bison.exe)
          choco install winflexbison3 -y --no-progress

          # Install libxml2 + zlib via vcpkg
          & "C:\vcpkg\vcpkg.exe" install libxml2:x64-windows-static zlib:x64-windows-static

          # 诊断：列出安装的库文件（CMakeLists.txt 已兼容 zlib.lib/zs.lib）
          Write-Output "--- Installed vcpkg lib files ---"
          $vcpkgLib = "C:\vcpkg\installed\x64-windows-static\lib"
          if (Test-Path $vcpkgLib) {
            Get-ChildItem $vcpkgLib -Filter "*.lib" | ForEach-Object { Write-Output "  $($_.Name)" }
          } else {
            Write-Output "  (lib dir not found at $vcpkgLib)"
          }

          # Install pytest for regression tests
          pip install pytest

      # ===================== Configure =====================
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/lib/llvm-18

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DFLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex" \
            -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DFLEX_EXECUTABLE="$((Get-Command win_flex).Source)" `
            -DBISON_EXECUTABLE="$((Get-Command win_bison).Source)"

      # ===================== Build =====================
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ===================== Test =====================
      - name: Smoke test — check hello.vix (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/vixc examples/hello.vix --check

      - name: Smoke test — check hello.vix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/vixc examples/hello.vix --check

      - name: Check — compile examples with ownership (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/vixc examples/pointer.vix --check
          ./build/vixc examples/fib.vix --check
          ./build/vixc examples/struct2.vix --check
          ! ./build/vixc examples/owner.vix --check

      - name: Check — compile examples with ownership (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          ./build/Release/vixc examples/pointer.vix --check
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          ./build/Release/vixc examples/fib.vix --check
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          ./build/Release/vixc examples/struct2.vix --check
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          ./build/Release/vixc examples/owner.vix --check
          if ($LASTEXITCODE -eq 0) { Write-Host "::error::owner.vix should have failed"; $failed = $true }
          if ($failed) { throw "One or more checks failed" }
          exit 0

      - name: Regression test — pytest (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p tests/build/
          cp build/vixc tests/build/
          python3 -m pytest tests/errors.py -v --tb=short -x

      - name: Regression test — pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/build/
          Copy-Item build/Release/vixc.exe tests/build/
          python -m pytest tests/errors.py -v --tb=short -x

      # ===================== Package =====================
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          PKG_NAME="vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          mkdir -p dist
          cp build/vixc dist/vixc

          ldd dist/vixc | awk '/=>/ { print $3 }' | while read lib; do
            case "$lib" in
              /lib/*|/usr/lib/x86_64-linux-gnu/libc.*|/lib64/*|/usr/lib/x86_64-linux-gnu/libm.*|/usr/lib/x86_64-linux-gnu/libpthread.*|/usr/lib/x86_64-linux-gnu/libdl.*|/usr/lib/x86_64-linux-gnu/librt.*|/usr/lib/x86_64-linux-gnu/ld-*) continue ;;
            esac
            cp -L "$lib" dist/ 2>/dev/null || true
          done

          patchelf --set-rpath '$ORIGIN' dist/vixc
          chmod +x dist/vixc

          tar czf "${PKG_NAME}.tar.gz" -C dist .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          PKG_NAME="vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          mkdir -p dist
          cp build/vixc dist/vixc
          chmod +x dist/vixc

          LLVM_PREFIX="$(brew --prefix llvm@18)"

          for dylib in \
            "${LLVM_PREFIX}/lib/libLLVM.dylib" \
            "${LLVM_PREFIX}/lib/libLLVM-18.dylib" \
            "${LLVM_PREFIX}/lib/liblldCommon.dylib" \
            "${LLVM_PREFIX}/lib/liblldELF.dylib" \
            "${LLVM_PREFIX}/lib/liblldMachO.dylib" \
            "${LLVM_PREFIX}/lib/liblldCOFF.dylib" \
            "${LLVM_PREFIX}/lib/liblldWasm.dylib" \
            "${LLVM_PREFIX}/lib/liblldMinGW.dylib"; do
            if [ -f "$dylib" ]; then
              cp -L "$dylib" dist/ 2>/dev/null || true
            fi
          done

          otool -L dist/vixc | awk 'NR>1 { print $1 }' | while read lib; do
            case "$lib" in
              /usr/lib/*|/System/*) continue ;;
            esac
            libname="$(basename "$lib")"
            if [ ! -f "dist/${libname}" ]; then
              if [ -f "$lib" ]; then
                cp -L "$lib" dist/ 2>/dev/null || true
              fi
            fi
          done

          for f in dist/*.dylib; do
            [ -f "$f" ] || continue
            chmod +w "$f"
            otool -L "$f" | awk 'NR>1 { print $1 }' | while read dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
              esac
              depname="$(basename "$dep")"
              if [ -f "dist/${depname}" ]; then
                install_name_tool -change "$dep" "@executable_path/${depname}" "$f" 2>/dev/null || true
              fi
            done
            install_name_tool -id "@executable_path/${depname}" "$f" 2>/dev/null || true
          done

          otool -L dist/vixc | awk 'NR>1 { print $1 }' | while read dep; do
            case "$dep" in
              /usr/lib/*|/System/*) continue ;;
            esac
            depname="$(basename "$dep")"
            if [ -f "dist/${depname}" ]; then
              install_name_tool -change "$dep" "@executable_path/${depname}" dist/vixc 2>/dev/null || true
            fi
          done

          tar czf "${PKG_NAME}.tar.gz" -C dist .

      - name: Fetch MinGW runtime libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # vixc links against the MinGW runtime (libmingw32.a, libgcc.a, ...).
          # Install a MinGW-w64 toolchain and bundle the runtime libraries into
          # dist/libc so the linker can find them on the end-user's machine.
          choco install mingw -y --no-progress

          # Locate the MinGW-w64 root installed by chocolatey.
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64",
            "C:\Program Files\mingw64",
            "C:\mingw64"
          )
          $mingwRoot = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingwRoot) {
            $mingwRoot = (Get-ChildItem "C:\ProgramData\chocolatey\lib\mingw\tools\install" -Directory `
              -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $mingwRoot -or -not (Test-Path $mingwRoot)) {
            throw "MinGW-w64 installation not found"
          }
          Write-Output "MinGW root: $mingwRoot"

          # MinGW-w64 sysroot libraries (libmingw32.a, libmsvcrt.a, import libs, crt2.o ...)
          $w64Lib = Join-Path $mingwRoot "x86_64-w64-mingw32\lib"
          if (-not (Test-Path $w64Lib)) { throw "MinGW sysroot lib dir not found: $w64Lib" }

          # GCC support libraries (libgcc.a, libgcc_eh.a, crtbegin.o, crtend.o ...)
          $gccVerDir = Get-ChildItem (Join-Path $mingwRoot "lib\gcc\x86_64-w64-mingw32") `
            -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1

          $libcDir = "dist/libc"
          New-Item -ItemType Directory -Force -Path $libcDir | Out-Null

          Copy-Item (Join-Path $w64Lib "*.a") $libcDir -Force
          Copy-Item (Join-Path $w64Lib "crt*.o") $libcDir -Force -ErrorAction SilentlyContinue
          if ($gccVerDir) {
            Copy-Item (Join-Path $gccVerDir.FullName "*.a") $libcDir -Force
            Copy-Item (Join-Path $gccVerDir.FullName "crt*.o") $libcDir -Force -ErrorAction SilentlyContinue
          }

          Write-Output "--- Bundled MinGW runtime libraries ---"
          Get-ChildItem $libcDir | ForEach-Object { Write-Output "  $($_.Name)" }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgName = "vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          New-Item -ItemType Directory -Force -Path dist/bin | Out-Null
          Copy-Item build/Release/vixc.exe dist/bin/vixc.exe

          # Find and bundle non-system DLL dependencies via dumpbin
          $processed = [System.Collections.Generic.HashSet[string]]::new()
          $queue = [System.Collections.Queue]::new()
          $queue.Enqueue((Resolve-Path "dist/bin/vixc.exe"))

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            # Use dumpbin to list DLL dependencies (extract leading DLL names with whitespace prefix)
            $rawDeps = & dumpbin /dependents $binary 2>$null
            $dllNames = $rawDeps | Select-String '^\s+([a-zA-Z].+\.dll)$' | ForEach-Object {
              $_.Matches.Groups[1].Value.ToLower()
            }
            foreach ($dllName in $dllNames) {
              if (-not $processed.Add($dllName)) { continue }

              # Skip well-known system DLLs
              if ($dllName -in @('kernel32.dll', 'ntdll.dll', 'user32.dll', 'gdi32.dll',
                  'advapi32.dll', 'shell32.dll', 'ole32.dll', 'oleaut32.dll',
                  'comdlg32.dll', 'comctl32.dll', 'ws2_32.dll', 'bcrypt.dll',
                  'msvcrt.dll', 'shlwapi.dll', 'secur32.dll', 'crypt32.dll',
                  'winmm.dll', 'iphlpapi.dll', 'rpcrt4.dll', 'setupapi.dll',
                  'version.dll', 'winhttp.dll', 'wtsapi32.dll', 'dnsapi.dll',
                  'dbghelp.dll', 'psapi.dll', 'userenv.dll', 'netapi32.dll')) { continue }

              # Search for the DLL in PATH and adjacent directories
              $found = $false
              $searchDirs = @(
                (Split-Path $binary -Parent)
                "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\bin"
              ) + ($env:PATH -split ';')
              foreach ($dir in $searchDirs) {
                $dllPath = Join-Path $dir $dllName
                if (Test-Path $dllPath) {
                  $dest = Join-Path "dist/bin" $dllName
                  Copy-Item $dllPath $dest -Force
                  Write-Output "  Bundled: $dllName"
                  $queue.Enqueue((Resolve-Path $dest))
                  $found = $true
                  break
                }
              }
              if (-not $found) {
                Write-Output "  Skipped (not found): $dllName"
              }
            }
          }

          # Create zip (7z is available on GitHub runners)
          cd dist
          & 7z a -tzip "../${pkgName}.zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixc-${{ matrix.name }}
          path: |
            vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}.${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.zip
          generate_release_notes: true
